<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Recipes</title>
<meta name="description" content="Our family's go-to recipes, some our own and others we've found.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-site.json">
<meta name="theme-color" content="#b4532a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f3ea; --paper:#fffdf8; --ink:#2b2420; --muted:#6f645c; --line:#e7dccb;
  --accent:#b4532a; --accent-soft:#f3dfd2; --sage:#5f7a5a; --sage-soft:#e1eadc;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1b1715;--paper:#24201d;--ink:#f1e9df;--muted:#a99d92;--line:#3a332e;
  --accent:#e0855a;--accent-soft:#3d2a20;--sage:#9cba94;--sage-soft:#26301f;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--line);background:var(--paper)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.35rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem}
.navbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.9rem;display:flex;gap:8px;align-items:center;text-decoration:none}
.nav{display:flex;gap:8px;align-items:center}
.navbtn.share{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (max-width:520px){.brand-name{display:none}.shop-label{display:none}}
.share-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:16px;padding:18px 20px;margin:0 0 56px}
.share-cta p{margin:0}
.navbtn .count{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;font-weight:600}
.hero{padding:24px 0 24px}
.hearth{margin:0 0 28px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#3a2a20}
.hearth img{width:100%;height:auto;display:block}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:0 0 10px}
.hero p{color:var(--muted);margin:0;max-width:560px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding-bottom:56px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.cat{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.card h2{font-family:Fraunces,Georgia,serif;font-size:1.3rem;line-height:1.25;margin:0}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font-size:.75rem;background:var(--sage-soft);color:var(--sage);padding:3px 9px;border-radius:999px}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* recipe page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;margin:24px 0 8px;font-size:.92rem}
.r-head h1{font-family:Fraunces,Georgia,serif;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.12;margin:6px 0 4px}
.r-head .sub{font-family:Fraunces,Georgia,serif;color:var(--muted);font-size:1.15rem;margin:0 0 12px}
.r-head .summary{max-width:680px;margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.92rem;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-size:.9rem;display:inline-flex;gap:7px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed=true]{background:var(--sage);border-color:var(--sage);color:#fff}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:.93rem}
.r-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px;margin:24px 0 40px}
@media (max-width:760px){.r-body{grid-template-columns:1fr;gap:20px}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.ing{position:sticky;top:16px;align-self:start}
@media (max-width:760px){.ing{position:static}}
.panel h2{font-family:Fraunces,Georgia,serif;font-size:1.3rem;margin:0 0 10px}
.panel h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{border-bottom:1px dashed var(--line)}
.checklist li:last-child{border-bottom:0}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:.95rem}
.checklist input{margin-top:4px;accent-color:var(--sage);width:17px;height:17px;flex:none}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:12px 10px 12px 48px;border-radius:12px;cursor:pointer;transition:background .15s}
ol.steps li:hover{background:var(--bg)}
ol.steps li::before{content:counter(s);position:absolute;left:8px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;display:grid;place-items:center;font-size:.85rem}
ol.steps li.done{opacity:.45}
ol.steps li.done::before{content:"✓";background:var(--sage);color:#fff}
.hint{font-size:.8rem;color:var(--muted);margin:-4px 0 8px}
.notes{margin-top:22px}
.credit{margin:0 0 6px;color:var(--muted)}
header.site .secnav{display:flex;justify-content:flex-start;gap:4px;height:auto;min-height:0;padding-bottom:8px;overflow-x:auto}
.secnav a{text-decoration:none;font-weight:600;font-size:.93rem;padding:7px 12px;border-radius:10px;color:var(--muted);white-space:nowrap}
.secnav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.secnav a[data-sec=found][aria-current=page]{background:var(--sage-soft);color:var(--sage)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.door{display:flex;flex-direction:column;gap:8px;text-decoration:none;border-radius:18px;padding:24px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.door:hover{transform:translateY(-2px);border-color:var(--accent)}
.door h2{font-family:Fraunces,Georgia,serif;font-size:1.7rem;line-height:1.15;margin:0}
.door p{margin:0;color:var(--muted)}
.door-kicker{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.door.found .door-kicker{color:var(--sage)}
.door.family{border-top:5px solid var(--accent)}
.door.found{border-top:5px solid var(--sage)}
.door-try{font-size:.88rem;color:var(--ink);font-style:italic}
.door-go{margin-top:auto;padding-top:8px;font-weight:600;color:var(--accent)}
.door.found .door-go{color:var(--sage)}
.sec-head{padding:8px 0 4px}
.sec-head h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:6px 0 8px}
.sec-head p{color:var(--muted);margin:0;max-width:620px}
.tagline{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--ink)!important;margin:-2px 0 6px!important}
.sec-head.family h1{color:var(--accent)}
.sec-head.found h1{color:var(--sage)}

.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:8px 0 4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;max-width:460px}
.sec{border:0;background:none;border-radius:10px;padding:9px 12px;font-size:.93rem;font-weight:500;color:var(--muted)}
.sec[aria-selected=true]{background:var(--accent);color:#fff}
.sec .n{font-size:.78rem;opacity:.75;margin-left:2px}
.sec-note{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.sec-note[hidden]{display:none}
.secbadge{font-size:.66rem;letter-spacing:.06em;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.secbadge.family{background:var(--accent-soft);color:var(--accent)}
.secbadge.found{background:var(--sage-soft);color:var(--sage)}
.credit strong{color:var(--ink)}
.unsure{font-size:.85em}
.muted{color:var(--muted)}
.adj{border-left:4px solid var(--sage)}
.gaps{border-left:4px solid var(--accent);background:var(--accent-soft)}
.gaps .btn{margin-top:8px}
.tag.gap{background:var(--accent-soft);color:var(--accent)}
.suggest-line{color:var(--muted);font-size:.9rem;margin:18px 4px 0}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:0 0 9px;font-size:.94rem}

/* shopping */
.shop-group{margin-bottom:18px}
.shop-group h3{display:flex;justify-content:space-between;align-items:center;font-family:Fraunces,Georgia,serif;text-transform:none;letter-spacing:0;font-size:1.05rem;color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);font-size:.85rem;padding:0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:24px 0 40px}
.install{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;color:var(--ink);font-size:.92rem}
.install[hidden]{display:none}
@media print{.install{display:none!important}}

@media print{
  header.site,.actions,.back,footer,.hint{display:none!important}
  body{background:#fff;color:#000}
  .panel{border:0;padding:0}
  .r-body{grid-template-columns:1fr 1.5fr;gap:24px}
  ol.steps li{padding:6px 0 6px 36px}
  ol.steps li::before{top:6px;left:0}
  .checklist input{display:none}
}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="#/"><img src="icon-192.png" alt="" width="30" height="30" style="border-radius:50%;object-fit:cover"><span class="brand-name">Family Recipes</span></a>
    <nav class="nav">
    <a class="navbtn share" href="https://tally.so/r/xVrP7o" target="_blank" rel="noopener">+ Share a recipe</a>
    <a class="navbtn" href="#/shopping" id="shopLink">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6 5 3H2"/></svg>
      <span class="shop-label">Shopping list</span> <span class="count" id="shopCount" hidden>0</span>
    </a>
    </nav>
  </div>
  <nav class="secnav wrap" aria-label="Sections">
    <a href="#/family" data-sec="family">Family Recipe Box</a>
    <a href="#/shelf" data-sec="found">The Cookbook Shelf</a>
  </nav>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">
  <div class="install" id="installBox">
    <div><strong>📲 Put Family Recipes on your phone</strong><br><span id="installHow">Opens like an app, right from your home screen.</span></div>
    <button class="btn primary" id="installBtn" type="button">Add to home screen</button>
  </div>
  Family Recipes · some our own, others we've found.
</div></footer>

<script src="recipes.js?v=20261105"></script>
<script src="cards.js?v=20261105"></script>
<script>
(function(){
const R = window.RECIPES || [];
const app = document.getElementById('app');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('fr:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('fr:'+k, JSON.stringify(v)); }catch(e){} }
};
let state = { q:'', cat:'All', sec:'all' };

let wakeLock = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
const SUGGEST_URL = 'https://tally.so/r/6DeJLe';
const CAT_ORDER = ['Breakfast','Appetizers','Dinner','Meats & Seafood','Casseroles','Soups','Salads','Breads','Desserts','Beverages','Thanksgiving'];
const suggestLink = r => SUGGEST_URL + '?recipe=' + encodeURIComponent(r.title);
const allText = r => [r.title, r.subtitle, r.summary, r.category, r.credit, ...(r.tags||[]), ...r.ingredients.flatMap(g=>g.items)].join(' ').toLowerCase();

function shopList(){ return store.get('shop', []); }
function updateShopCount(){
  const n = shopList().length, el = document.getElementById('shopCount');
  el.hidden = !n; el.textContent = n;
}

const SEC = {
  family: { name:'Family Recipe Box', route:'family', tagline:'Passed down, card by card', blurb:'Recipes from our own kitchens and the cards in the family recipe box, kept just as they were written.' },
  found:  { name:'The Cookbook Shelf', route:'shelf', tagline:'Recipes gathered along the way', blurb:'Recipes from magazines, newspapers, cookbooks and the web that earned a spot on the shelf.' }
};
const secCount = k => R.filter(r=>r.section===k).length;
const catsFor = list => ['All', ...Array.from(new Set(list.map(r=>r.category))).sort((a,b)=>{const i=CAT_ORDER.indexOf(a),j=CAT_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);})];

function setNav(active){
  document.querySelectorAll('.secnav a').forEach(a => a.setAttribute('aria-current', a.dataset.sec === active ? 'page' : 'false'));
}

function home(){
  setNav('');
  const pick = k => { const l = R.filter(r=>r.section===k); return l.length ? l[Math.floor(Math.random()*l.length)] : null; };
  app.innerHTML = `
    <section class="hero">
      <figure class="hearth"><img src="hearth.webp" alt="Painting of an old colonial kitchen hearth, from the front of the family recipe box" width="1600" height="917"></figure>
      <h1>What are we cooking?</h1>
      <p>Two shelves in our kitchen: the cards from the family recipe box, and the recipes we've collected from everywhere else.</p>
    </section>
    <div class="doors">
      ${['family','found'].map(k => { const s = SEC[k], p = pick(k); return `
      <a class="door ${k}" href="#/${s.route}">
        <span class="door-kicker">${secCount(k)} recipes</span>
        <h2>${s.name}</h2>
        <p class="tagline">${s.tagline}</p>
        <p>${s.blurb}</p>
        ${p ? `<span class="door-try">Try: ${esc(p.title)}</span>` : ''}
        <span class="door-go">Open ${s.name} →</span>
      </a>`; }).join('')}
    </div>
    <label class="search" aria-label="Search all recipes" style="display:block;margin:28px 0 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search both: a recipe, an ingredient, or who it's from…" value="${esc(state.q)}">
    </label>
    <div class="grid" id="grid" style="margin-top:18px"></div>
    <div class="share-cta">
      <p><strong>Have a family favorite?</strong> Type it in or just snap a photo of the recipe card. No account needed.</p>
      <a class="btn primary" href="https://tally.so/r/xVrP7o" target="_blank" rel="noopener" style="text-decoration:none">+ Share a recipe</a>
    </div>`;
  state.sec = 'all'; state.cat = 'All';
  const q = document.getElementById('q');
  q.addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
  renderGrid();
}

function sectionPage(k){
  const s = SEC[k]; setNav(k);
  document.title = s.name + ' · Family Recipes';
  if (state.sec !== k) { state.sec = k; state.cat = 'All'; }
  const cats = catsFor(R.filter(r=>r.section===k));
  if (!cats.includes(state.cat)) state.cat = 'All';
  app.innerHTML = `
    <section class="sec-head ${k}">
      <a class="back" href="#/">← Home</a>
      <h1>${s.name}</h1>
      <p class="tagline">${s.tagline}</p>
      <p>${s.blurb}</p>
    </section>
    <div class="controls">
      <label class="search" aria-label="Search ${s.name}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search ${s.name}…" value="${esc(state.q)}">
      </label>
      <div class="chips" role="group" aria-label="Category">
        ${cats.map(c=>`<button class="chip" aria-pressed="${c===state.cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>
    </div>
    <div class="grid" id="grid"></div>
    ${k==='family' ? `<div class="share-cta">
      <p><strong>Have a card that belongs in the box?</strong> Type it in or just snap a photo of it. No account needed.</p>
      <a class="btn primary" href="https://tally.so/r/xVrP7o" target="_blank" rel="noopener" style="text-decoration:none">+ Share a recipe</a>
    </div>` : ''}`;
  const q = document.getElementById('q');
  q.addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    state.cat = b.dataset.cat;
    app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x===b));
    renderGrid();
  });
  renderGrid();
  window.scrollTo(0,0);
}

function renderGrid(){
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const onHome = state.sec === 'all';
  if (onHome && !terms.length) { document.getElementById('grid').innerHTML = ''; return; }
  const list = R.slice().sort((a,b)=>a.title.localeCompare(b.title)).filter(r => (onHome || r.section===state.sec) && (state.cat==='All' || r.category===state.cat) && terms.every(t => allText(r).includes(t)));
  const g = document.getElementById('grid');
  g.innerHTML = list.length ? list.map(r => `
    <a class="card" href="#/recipe/${r.slug}">
      <span class="cat">${esc(r.category)}${onHome && r.section?` <span class="secbadge ${r.section}">${r.section==="family"?"Recipe Box":"Cookbook Shelf"}</span>`:""}</span>
      <h2>${esc(r.title)}</h2>
      <p>${esc(r.summary)}</p>
      <div class="meta">${r.serves?`<span class="tag">Serves ${esc(r.serves)}</span>`:''}${(r.tags||[]).filter(t=>t!=='recipe box').slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${r.gaps&&r.gaps.length?'<span class="tag gap">needs a fill-in</span>':''}</div>
    </a>`).join('') : `<p class="empty">No recipes match that search.</p>`;
}

function recipe(slug){
  const r = R.find(x => x.slug === slug); setNav(r ? r.section : '');
  if(!r){ app.innerHTML = `<a class="back" href="#/">← Home</a><p class="empty">Recipe not found.</p>`; return; }
  document.title = r.title + ' · Family Recipes';
  const checks = store.get('chk:'+slug, {});
  const inList = shopList().includes(slug);
  let n = 0;
  const ingHtml = r.ingredients.map(g => `
    ${g.name ? `<h3>${esc(g.name)}</h3>` : ''}
    <ul class="checklist">${g.items.map(it => { const id = 'i'+(n++); return `<li><label><input type="checkbox" data-k="${id}" ${checks[id]?'checked':''}><span>${esc(it)}</span></label></li>`; }).join('')}</ul>`).join('');
  app.innerHTML = `
    <a class="back" href="#/${r.section ? SEC[r.section].route : ''}">← ${r.section ? SEC[r.section].name : 'Home'}</a>
    <div class="r-head">
      <span class="cat">${esc(r.category)}${r.section?` <span class="secbadge ${r.section}">${SEC[r.section].name}</span>`:""}</span>
      <h1>${esc(r.title)}</h1>
      ${r.subtitle ? `<p class="sub">${esc(r.subtitle)}</p>` : ''}
      ${r.fromBox ? '' : `<p class="summary">${esc(r.summary)}</p>`}
      ${(r.fromBox || r.credit) ? `<p class="credit">${r.credit ? `${r.section==='found' ? 'From' : 'From the kitchen of'} <strong>${esc(r.credit)}</strong>${r.creditUnsure?' <span class="unsure">(name hard to read)</span>':''}${r.creditNote?` <span class="unsure">· ${esc(r.creditNote)}</span>`:''}` : 'From the family recipe box'}${r.cardNote ? ` · card says <em>“${esc(r.cardNote)}”</em>` : ''}</p>` : ''}
      ${r.source ? `<p class="credit">Source: ${r.source.url ? `<a href="${esc(r.source.url)}" target="_blank" rel="noopener">${esc(r.source.text)}</a>` : esc(r.source.text)}</p>` : ''}
      <div class="facts">${r.serves?`<span><strong>Serves</strong> ${esc(r.serves)}</span>`:''}${r.time?`<span>${esc(r.time)}</span>`:''}${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="actions">
      <button class="btn ${inList?'':'primary'}" id="addShop">${inList ? '✓ On shopping list' : '+ Add to shopping list'}</button>
      <button class="btn" id="cook" aria-pressed="${!!wakeLock}" title="Keeps your screen from going to sleep while you cook">Cook mode</button>
      <button class="btn" id="reset">Reset checks</button>
      <button class="btn" onclick="window.print()">Print</button>
    </div>
    ${r.tip ? `<div class="tip">${md(r.tip)}</div>` : ''}
    <div class="r-body">
      <section class="panel ing"><h2>Ingredients</h2>${ingHtml}</section>
      <section>
        <div class="panel">
          <h2>Instructions</h2>
          ${r.steps.length ? `<p class="hint">Tap a step to mark it done.</p><ol class="steps">${r.steps.map((s,i)=>`<li data-k="s${i}" class="${checks['s'+i]?'done':''}">${md(s)}</li>`).join('')}</ol>` : '<p class="muted">No instructions on the card.</p>'}
        </div>
        ${r.adjustments && r.adjustments.length ? `<div class="panel notes adj"><h2>Adjustments</h2><p class="hint">Later notes added to the card. The recipe above is the original.</p><ul>${r.adjustments.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>` : ''}
        ${r.cardNotes && r.cardNotes.length ? `<div class="panel notes"><h2>On the card</h2><ul>${r.cardNotes.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>` : ''}
        ${r.gaps && r.gaps.length ? `<div class="panel notes gaps"><h2>Missing from the card</h2><ul>${r.gaps.map(x=>`<li>${md(x)}</li>`).join('')}</ul>${SUGGEST_URL ? `<a class="btn primary" href="${suggestLink(r)}" target="_blank" rel="noopener" style="text-decoration:none">I know this — suggest a fill-in</a>` : '<p class="hint">Know the answer? Let Jimmie know.</p>'}</div>` : ''}
        ${SUGGEST_URL && r.fromBox && !(r.gaps && r.gaps.length) ? `<p class="suggest-line">Know something about this recipe — who it came from or the story behind it? <a href="${suggestLink(r)}" target="_blank" rel="noopener">Share it</a></p>` : ''}
        ${r.notes && r.notes.length ? `<div class="panel notes"><h2>Notes</h2><ul>${r.notes.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>` : ''}
      </section>
    </div>`;
  const save = () => store.set('chk:'+slug, checks);
  app.querySelectorAll('.checklist input').forEach(i => i.onchange = () => { checks[i.dataset.k] = i.checked; save(); });
  app.querySelectorAll('ol.steps li').forEach(li => li.onclick = () => { const k = li.dataset.k; checks[k] = !checks[k]; li.classList.toggle('done', checks[k]); save(); });
  document.getElementById('reset').onclick = () => { store.set('chk:'+slug, {}); recipe(slug); };
  document.getElementById('addShop').onclick = () => {
    let l = shopList();
    l = l.includes(slug) ? l.filter(s=>s!==slug) : [...l, slug];
    store.set('shop', l); updateShopCount(); recipe(slug);
  };
  const cookBtn = document.getElementById('cook');
  if(!('wakeLock' in navigator)) cookBtn.hidden = true;
  cookBtn.onclick = async () => {
    try{
      if(wakeLock){ await wakeLock.release(); wakeLock = null; }
      else { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; cookBtn.setAttribute('aria-pressed', false); }); }
    }catch(e){ wakeLock = null; }
    cookBtn.setAttribute('aria-pressed', !!wakeLock);
  };
  window.scrollTo(0,0);
}

function shopping(){
  document.title = 'Shopping list · Family Recipes';
  const slugs = shopList().filter(s => R.some(r=>r.slug===s));
  const got = store.get('shopchk', {});
  if(!slugs.length){
    app.innerHTML = `<a class="back" href="#/">← Home</a><div class="r-head"><h1>Shopping list</h1></div>
      <p class="empty">Nothing here yet. Open a recipe and tap “Add to shopping list”.</p>`;
    return;
  }
  app.innerHTML = `
    <a class="back" href="#/">← Home</a>
    <div class="r-head"><h1>Shopping list</h1><p class="summary">Ingredients from ${slugs.length} recipe${slugs.length>1?'s':''}. Check off what you already have or have grabbed.</p></div>
    <div class="actions"><button class="btn" id="clearChecks">Uncheck all</button><button class="btn" id="clearAll">Clear list</button><button class="btn" onclick="window.print()">Print</button></div>
    <div class="panel" style="margin:16px 0 48px">
      ${slugs.map(s => { const r = R.find(x=>x.slug===s); let n=0; return `
        <div class="shop-group">
          <h3><a href="#/recipe/${s}">${esc(r.title)}</a> <button class="linkbtn" data-rm="${s}">Remove</button></h3>
          <ul class="checklist">${r.ingredients.flatMap(g=>g.items).map(it => { const k = s+':'+(n++); return `<li><label><input type="checkbox" data-k="${esc(k)}" ${got[k]?'checked':''}><span>${esc(it)}</span></label></li>`; }).join('')}</ul>
        </div>`; }).join('')}
    </div>`;
  app.querySelectorAll('.checklist input').forEach(i => i.onchange = () => { got[i.dataset.k] = i.checked; store.set('shopchk', got); });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { store.set('shop', shopList().filter(x=>x!==b.dataset.rm)); updateShopCount(); shopping(); });
  document.getElementById('clearChecks').onclick = () => { store.set('shopchk', {}); shopping(); };
  document.getElementById('clearAll').onclick = () => { store.set('shop', []); store.set('shopchk', {}); updateShopCount(); shopping(); };
}

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  document.title = 'Family Recipes';
  if(h.startsWith('recipe/')) recipe(h.slice(7));
  else if(h === 'shopping') { setNav(''); shopping(); }
  else if(h === 'family') sectionPage('family');
  else if(h === 'shelf') sectionPage('found');
  else home();
  updateShopCount();
}
window.addEventListener('hashchange', route);

// ---- Install as an app (anyone, no login) ----
(function(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function(){});
  var box = document.getElementById('installBox'), btn = document.getElementById('installBtn'), how = document.getElementById('installHow');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) { box.hidden = true; return; }
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var samsung = /SamsungBrowser/.test(navigator.userAgent);
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function(){ box.hidden = true; });
  btn.onclick = function(){
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function(){ deferred = null; }); return; }
    how.textContent = ios
      ? 'In Safari, tap the Share icon in the toolbar, then “Add to Home Screen.”'
      : samsung
        ? 'Tap ☰ at the bottom right, then “Add page to” → “Home screen.”'
        : 'Open your browser menu (⋮) and choose “Install app” or “Add to Home screen.”';
  };
})();
route();
})();
</script>
</body>
</html>
