<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Recipes</title>
<meta name="description" content="Our family's go-to recipes, some our own and others we've found.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-site.json">
<meta name="theme-color" content="#b4532a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f3ea; --paper:#fffdf8; --ink:#2b2420; --muted:#6f645c; --line:#e7dccb;
  --accent:#b4532a; --accent-soft:#f3dfd2; --sage:#5f7a5a; --sage-soft:#e1eadc;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1b1715;--paper:#24201d;--ink:#f1e9df;--muted:#a99d92;--line:#3a332e;
  --accent:#e0855a;--accent-soft:#3d2a20;--sage:#9cba94;--sage-soft:#26301f;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--line);background:var(--paper)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.35rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem}
.navbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.9rem;display:flex;gap:8px;align-items:center;text-decoration:none}
.nav{display:flex;gap:8px;align-items:center}
.navbtn.share{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (max-width:520px){.brand-name{display:none}.shop-label{display:none}}
.share-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:16px;padding:18px 20px;margin:0 0 56px}
.share-cta p{margin:0}
.navbtn .count{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;font-weight:600}
.hero{padding:24px 0 24px}
.hearth{margin:0 0 28px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#3a2a20}
.hearth img{width:100%;height:auto;display:block}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:0 0 10px}
.hero p{color:var(--muted);margin:0;max-width:560px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding-bottom:56px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.cat{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.card h2{font-family:Fraunces,Georgia,serif;font-size:1.3rem;line-height:1.25;margin:0}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font-size:.75rem;background:var(--sage-soft);color:var(--sage);padding:3px 9px;border-radius:999px}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* recipe page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;margin:24px 0 8px;font-size:.92rem}
.r-head h1{font-family:Fraunces,Georgia,serif;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.12;margin:6px 0 4px}
.r-head .sub{font-family:Fraunces,Georgia,serif;color:var(--muted);font-size:1.15rem;margin:0 0 12px}
.r-head .summary{max-width:680px;margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.92rem;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-size:.9rem;display:inline-flex;gap:7px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed=true]{background:var(--sage);border-color:var(--sage);color:#fff}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:.93rem}
.r-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px;margin:24px 0 40px}
@media (max-width:760px){.r-body{grid-template-columns:1fr;gap:20px}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.ing{position:sticky;top:16px;align-self:start}
@media (max-width:760px){.ing{position:static}}
.panel h2{font-family:Fraunces,Georgia,serif;font-size:1.3rem;margin:0 0 10px}
.panel h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{border-bottom:1px dashed var(--line)}
.checklist li:last-child{border-bottom:0}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:.95rem}
.checklist input{margin-top:4px;accent-color:var(--sage);width:17px;height:17px;flex:none}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:12px 10px 12px 48px;border-radius:12px;cursor:pointer;transition:background .15s}
ol.steps li:hover{background:var(--bg)}
ol.steps li::before{content:counter(s);position:absolute;left:8px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;display:grid;place-items:center;font-size:.85rem}
ol.steps li.done{opacity:.45}
ol.steps li.done::before{content:"✓";background:var(--sage);color:#fff}
.hint{font-size:.8rem;color:var(--muted);margin:-4px 0 8px}
.notes{margin-top:22px}
.credit{margin:0 0 6px;color:var(--muted)}
header.site .secnav{display:flex;justify-content:flex-start;gap:4px;height:auto;min-height:0;padding-bottom:8px;overflow-x:auto}
.secnav a{text-decoration:none;font-weight:600;font-size:.93rem;padding:7px 12px;border-radius:10px;color:var(--muted);white-space:nowrap}
.secnav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.secnav a[data-sec=found][aria-current=page]{background:var(--sage-soft);color:var(--sage)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.door{display:flex;flex-direction:column;gap:8px;text-decoration:none;border-radius:18px;padding:24px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.door:hover{transform:translateY(-2px);border-color:var(--accent)}
.door h2{font-family:Fraunces,Georgia,serif;font-size:1.7rem;line-height:1.15;margin:0}
.door p{margin:0;color:var(--muted)}
.door-kicker{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.door.found .door-kicker{color:var(--sage)}
.door.family{border-top:5px solid var(--accent)}
.door.found{border-top:5px solid var(--sage)}
.door-try{font-size:.88rem;color:var(--ink);font-style:italic}
.door-go{margin-top:auto;padding-top:8px;font-weight:600;color:var(--accent)}
.door.found .door-go{color:var(--sage)}
.sec-head{padding:8px 0 4px}
.sec-head h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:6px 0 8px}
.sec-head p{color:var(--muted);margin:0;max-width:620px}
.tagline{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--ink)!important;margin:-2px 0 6px!important}
.sec-head.family h1{color:var(--accent)}
.sec-head.found h1{color:var(--sage)}
/* ---- Family Recipe Box: index-card look ---- */
:root{--idx-paper:#fffaf0;--idx-rule:rgba(90,130,190,.18);--idx-red:#c8574a;--hand:#3b3a7a}
@media (prefers-color-scheme:dark){:root{--idx-paper:#2b2621;--idx-rule:rgba(140,170,220,.12);--idx-red:#d0675a;--hand:#b9c3ff}}
.card.idx{background:var(--idx-paper);border-radius:6px;border-color:var(--line);padding-top:16px}
.card.idx .cat{display:block;border-bottom:2px solid var(--idx-red);padding-bottom:8px;margin-bottom:2px}
.card.idx .cat{color:var(--accent)}
.card.idx p:not(.hand){background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.6em - 1px),var(--idx-rule) calc(1.6em - 1px),var(--idx-rule) 1.6em);line-height:1.6em}
.card.idx h2{margin-top:4px}
.card.idx .hand{font-family:Caveat,'Segoe Print','Comic Sans MS',cursive;font-size:1.3rem;line-height:1.2;color:var(--hand);margin:2px 0 0}
.card.idx .hand .note{font-size:1.1rem;opacity:.85}
.card.idx:hover{border-color:var(--accent);transform:translateY(-2px) rotate(-.3deg)}

/* ---- The recipe stand (Family Recipe Box header) ---- */
:root{--wood1:#3a2316;--wood2:#5b3a25;--wood3:#2a180e}
.stand{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:44px;align-items:center;margin:14px 0 4px}
.stand-obj{display:flex;flex-direction:column;align-items:center;padding-right:10px;filter:drop-shadow(0 18px 14px rgba(25,10,3,.35))}
.stand-plaque{position:relative;width:100%;z-index:2}
.stand-plaque::before{content:"";position:absolute;inset:0;transform:translate(0,9px);background:#150a04;clip-path:url(#plaqueClip)}
.stand-board{position:relative;width:100%;padding:11% 8% 12%;clip-path:url(#plaqueClip);
  background:
    radial-gradient(130% 80% at 22% 0%,rgba(255,220,180,.16),transparent 58%),
    linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(0,0,0,.34)),
    linear-gradient(90deg,rgba(0,0,0,.30),transparent 9%,transparent 91%,rgba(0,0,0,.30)),
    url(wood.webp) center/cover}
.stand-painting{margin:0 auto;width:92%;aspect-ratio:2/1;overflow:hidden;border-radius:2px;background:#e8dbbd;padding:3px;box-shadow:0 0 0 2px #1c0f07,0 0 0 3px rgba(255,225,190,.22),inset 0 0 6px rgba(0,0,0,.4),3px 4px 7px rgba(0,0,0,.6)}
.stand-painting img{display:block;width:100%;height:100%;object-fit:cover;box-shadow:inset 0 0 8px rgba(0,0,0,.45)}
.rings{position:relative;height:0;z-index:3}
.rings i{position:absolute;top:2px;width:18px;height:38px;padding:4px;border-radius:11px;background:linear-gradient(90deg,#f0f0f4,#9a9aa2 30%,#4a4a52 70%,#1c1c20);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.65))}
.rings i:nth-child(1){left:11%}.rings i:nth-child(2){right:11%}
.stand-cover{position:relative;margin-top:20px;aspect-ratio:1.78;border-radius:3px;background:url(box-cover.webp) center/cover;box-shadow:1px 1px 0 #f1e6c6,2px 2px 0 #b9a577,3px 3px 0 #f1e6c6,4px 4px 0 #b9a577,5px 5px 0 #f1e6c6,6px 6px 0 #a8946a,9px 11px 12px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.5)}
.stand-cover::after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(118deg,rgba(255,255,255,.2),transparent 36%,rgba(0,0,0,.14) 100%),radial-gradient(ellipse at center,transparent 55%,rgba(70,35,0,.3));pointer-events:none}
.idx-edge{position:absolute;left:5%;right:5%;bottom:-17px;height:16px;display:flex;flex-direction:row;gap:5px;z-index:2}
.idx-edge i{flex:1;border-radius:0 0 5px 5px;background:linear-gradient(180deg,#f2e5bf,#d4bd84 80%,#bfa66c);box-shadow:2px 3px 3px rgba(0,0,0,.55),inset 1px 0 0 rgba(255,255,255,.5)}
.stand-foot{position:relative;width:250px;height:176px;margin-top:92px;z-index:1}
.stand-foot>*{position:absolute;left:50%;transform:translateX(-50%)}
.f-b1{width:250px;height:102px;top:73px;border-radius:0 0 125px 125px/0 0 52px 52px;background:linear-gradient(180deg,rgba(255,225,190,.0) 0,rgba(255,225,190,.30) 16%,rgba(0,0,0,0) 34%,rgba(0,0,0,.28) 62%,rgba(255,225,190,.14) 72%,rgba(0,0,0,.55) 100%),linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.05) 24%,rgba(255,225,190,.14) 42%,rgba(0,0,0,.3) 70%,rgba(0,0,0,.85)),linear-gradient(rgba(30,8,0,.38),rgba(30,8,0,.38)),url(wood-h.webp) center/cover;box-shadow:0 6px 6px rgba(0,0,0,.45)}
.f-t1{width:250px;height:105px;top:21px;border-radius:50%;background:radial-gradient(ellipse at 42% 30%,rgba(255,225,190,.2),rgba(0,0,0,.35) 90%),linear-gradient(rgba(30,8,0,.38),rgba(30,8,0,.38)),url(wood.webp) center/cover;box-shadow:inset 0 4px 4px rgba(255,225,190,.25),inset 0 -3px 5px rgba(0,0,0,.6)}
.f-b2{width:205px;height:73px;top:43px;border-radius:0 0 103px 103px/0 0 43px 43px;background:linear-gradient(180deg,rgba(255,225,190,.0) 0,rgba(255,225,190,.30) 16%,rgba(0,0,0,0) 34%,rgba(0,0,0,.28) 62%,rgba(255,225,190,.14) 72%,rgba(0,0,0,.55) 100%),linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.05) 24%,rgba(255,225,190,.14) 42%,rgba(0,0,0,.3) 70%,rgba(0,0,0,.85)),linear-gradient(rgba(30,8,0,.38),rgba(30,8,0,.38)),url(wood-h.webp) 30% 40%/cover;box-shadow:0 7px 6px rgba(0,0,0,.55)}
.f-t2{width:205px;height:86px;top:0;border-radius:50%;background:radial-gradient(ellipse at 42% 30%,rgba(255,225,190,.22),rgba(0,0,0,.3) 85%),linear-gradient(rgba(30,8,0,.38),rgba(30,8,0,.38)),url(wood.webp) 20% 50%/cover;box-shadow:inset 0 4px 4px rgba(255,225,190,.35),inset 0 -4px 6px rgba(0,0,0,.55),0 -1px 0 rgba(0,0,0,.5)}
.f-rec{width:70px;height:22px;top:47px;border-radius:50%;background:rgba(10,3,0,.45);box-shadow:inset 0 3px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,225,190,.12)}
.stand-neck{width:40px;height:124px;top:-104px;clip-path:polygon(12% 0,88% 0,100% 74%,92% 86%,82% 93%,74% 100%,26% 100%,18% 93%,8% 86%,0 74%);background:linear-gradient(90deg,rgba(6,2,1,.9),rgba(6,2,1,.2) 30%,rgba(255,220,180,.18) 46%,rgba(6,2,1,.4) 72%,rgba(6,2,1,.92)),linear-gradient(rgba(30,8,0,.38),rgba(30,8,0,.38)),url(wood.webp) 20% 0/230px;z-index:3}
.f-collar{width:30px;height:11px;top:-1px;border-radius:50%/55%;background:linear-gradient(90deg,#0b0402,#4d2f1a 42%,#0b0402);box-shadow:0 2px 2px rgba(0,0,0,.55);z-index:4}
.stand-bulb{width:54px;height:52px;top:8px;border-radius:46% 46% 36% 36%/46% 46% 34% 34%;background:radial-gradient(ellipse at 36% 28%,rgba(255,225,190,.4),rgba(0,0,0,0) 52%),linear-gradient(90deg,rgba(6,2,1,.85),rgba(6,2,1,.05) 35%,rgba(6,2,1,.4) 70%,rgba(6,2,1,.92)),linear-gradient(rgba(30,8,0,.38),rgba(30,8,0,.38)),url(wood.webp) 40% 30%/200px;box-shadow:0 3px 3px rgba(0,0,0,.7);z-index:4}
.stand-text h1{margin:0 0 6px}
.stand-text .tagline{font-size:1.3rem;margin:0 0 14px!important}
.stand-text p{color:var(--muted);margin:0;max-width:34ch}
@media (max-width:760px){.stand{grid-template-columns:1fr;gap:20px}.stand-obj{max-width:400px;margin:0 auto;width:100%}.stand-text{text-align:center}.stand-text p{margin:0 auto}}
.chips.tabs{gap:6px;border-bottom:3px solid #c9a95c;padding-bottom:0;align-items:flex-end}
.chips.tabs .chip{border-radius:10px 10px 0 0;background:#efe2c0;border:1px solid #d8c08a;border-bottom:0;color:#5a3b1d;margin-bottom:-1px}
.chips.tabs .chip[aria-pressed=true]{background:#c9a95c;border-color:#c9a95c;color:#2a180e;font-weight:600}
@media (prefers-color-scheme:dark){.chips.tabs .chip{background:#3a3020;border-color:#5a4a30;color:#e8d6ad}.chips.tabs .chip[aria-pressed=true]{background:#c9a95c;color:#1b1715}}
/* home door: mini stand */
.door-art.box-thumb{display:flex!important;flex-direction:column;align-items:center;justify-content:flex-end;margin:-6px -6px 6px;padding:8px 0 6px;border-radius:12px;height:160px;background:linear-gradient(180deg,rgba(90,58,37,.06),rgba(90,58,37,.12))}
.mini-board{width:54%;max-width:220px;height:104px;border-radius:16px 16px 6px 6px;padding:8px;background:linear-gradient(180deg,var(--wood2),var(--wood1));box-shadow:0 4px 10px rgba(40,20,10,.3);display:flex;flex-direction:column;gap:7px}
.mini-board::before{content:"";display:block;height:48px;border-radius:6px;background:url(hearth.webp) center/cover}
.mini-cover{flex:1;border-radius:2px;background:url(box-cover.webp) center/cover}
.door-art.box-thumb::before{content:none}
.mini-post{display:block;width:16px;height:16px;background:var(--wood1)}
.mini-base{display:block;width:90px;height:14px;border-radius:50%;background:var(--wood2);margin-top:-2px}
/* ---- Scaling, photos, pantry, daily pick ---- */
.scale{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:2px 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.scale-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.serv{display:inline-flex;align-items:center;gap:8px;font-size:.92rem}
.serv button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.1rem;line-height:1;color:var(--ink)}
.serv b{min-width:1.6em;text-align:center}
.scale-note{flex-basis:100%;margin:0;color:var(--muted);font-size:.82rem}
.photo-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.origcard img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:rotate(-.6deg);border:1px solid var(--line)}
.gallery{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin:6px 0 4px}
.gallery .photo-btn{width:auto;flex:0 0 auto}
.gallery img{display:block;height:150px;width:auto;border-radius:10px;box-shadow:var(--shadow)}
.photo-add{margin:6px 0 40px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,6,3,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.lightbox .lb-cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#f3e9d8;font-size:.9rem}
.pantry-grid{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.pantry-grid .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.pantry-hit .why{font-size:.82rem;color:var(--muted);margin:0 0 6px 4px}
.pantry-hit .why.all{color:#3f7a46;font-weight:600}
.pantry-hit{margin-bottom:6px}
.pantry-banner{display:flex;align-items:center;gap:14px;margin:14px 0 0;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:var(--paper);text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.pantry-banner .em{font-size:1.7rem}
.pantry-banner strong{display:block}
.pantry-banner span.sub{color:var(--muted);font-size:.92rem}
.pick{margin:0 0 22px;padding:18px 20px 14px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}
.pick-kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.pick-why{margin:4px 0 12px;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.12rem;color:var(--ink)}
.pick .card{box-shadow:none}
.pick-again{margin-top:10px}
/* ---- Favorites ---- */
.card{position:relative}
.fav{position:absolute;top:8px;right:8px;z-index:2;border:0;background:transparent;font-size:1.45rem;line-height:1;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:999px;transition:transform .12s}
.fav:hover{transform:scale(1.15)}
.fav[aria-pressed=true]{color:#c23a3a}
.card .cat{padding-right:34px}
.btn.faved{border-color:#c23a3a;color:#c23a3a}
.fav-note{color:var(--muted);font-size:.9rem;margin:-4px 0 14px}
/* ---- Cookbook Shelf: book look ---- */
.card.book{border-radius:4px 14px 14px 4px;border-left:10px solid var(--sage);background:var(--paper);padding-left:18px}
.card.book .src{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--sage)}
.card.book .cat{color:var(--muted);font-weight:500}
.card.book h2{font-family:Fraunces,Georgia,serif}
.card.book:hover{border-color:var(--sage);border-left-color:var(--sage)}
/* ---- Section art ---- */
.sec-head .hearth{margin:10px 0 18px}
.shelf-art,.door-art.spines{display:flex;align-items:flex-end;gap:5px;height:110px;padding:0 14px;border-bottom:8px solid #8a6a4a;margin:10px 0 18px;border-radius:2px}
.shelf-art span,.door-art.spines span{flex:1;height:var(--h);background:var(--c);border-radius:3px 3px 0 0;color:rgba(255,255,255,.85);font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.door-art{display:block;margin:-6px -6px 6px;border-radius:12px;overflow:hidden}
.door-art.hearth-thumb img{width:100%;height:130px;object-fit:cover;display:block}
.door-art.spines{height:130px;margin:-6px 0 6px;padding:0 10px;border-radius:0}
.door.family{background:var(--idx-paper)}
.door.family h2{color:var(--accent)}
.door.found{border-left:10px solid var(--sage);border-top:1px solid var(--line);border-radius:4px 18px 18px 4px}
.door.found h2{color:var(--sage)}

.hol-banner{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:16px 20px;border-radius:16px;background:var(--paper);border:1px solid var(--line);text-decoration:none;box-shadow:var(--shadow)}
.hol-banner:hover{border-color:var(--accent)}
.hol-banner .hol-emoji{font-size:1.8rem}
.hol-banner .door-go{margin:0 0 0 auto;padding:0;white-space:nowrap}
@media (max-width:560px){.hol-banner{flex-wrap:wrap}.hol-banner .door-go{margin-left:0}}
.secnav a[data-sec=holidays][aria-current=page]{background:#efe3c8;color:#8a5a12}
.sec-head.holidays h1{color:#8a5a12}
.hol-picker[hidden]{display:none}
.hol-picker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:14px 0 4px;scrollbar-width:thin}
.hol-chip{flex:none;text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:.92rem;white-space:nowrap}
.hol-chip[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hol-chip .n{font-size:.75rem;opacity:.7}
.hol-title h2{font-family:Fraunces,Georgia,serif;font-size:1.9rem;margin:14px 0 2px}
.hol-title p{margin:0 0 8px;color:var(--muted)}
.hol-group{margin:22px 0 0}
.hol-group > h2{font-family:Fraunces,Georgia,serif;font-size:1.25rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.hol-group.family > h2{color:var(--accent)}
.hol-group.found > h2{color:var(--sage)}
.hol-group > h2 .n{font-family:Inter,system-ui,sans-serif;font-size:.8rem;color:var(--muted);font-weight:500}
.hol-group .grid{padding-bottom:8px}
.hol-group ~ .share-cta{margin-top:26px}
@media (max-width:420px){.secnav .long{display:none}.secnav a{padding:7px 10px}}
.empty-soft{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;margin:0}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.tag.hol{background:#efe3c8;color:#8a5a12}
.hol-line{margin:2px 0 8px;display:flex;gap:8px;flex-wrap:wrap}
.hol-line a{font-size:.85rem;text-decoration:none;background:#efe3c8;color:#8a5a12;padding:3px 10px;border-radius:999px}
@media (prefers-color-scheme:dark){.tag.hol,.hol-line a{background:#3a2e1a;color:#e8c27a}.secnav a[data-sec=holidays][aria-current=page]{background:#3a2e1a;color:#e8c27a}.sec-head.holidays h1{color:#e8c27a}}


.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:8px 0 4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;max-width:460px}
.sec{border:0;background:none;border-radius:10px;padding:9px 12px;font-size:.93rem;font-weight:500;color:var(--muted)}
.sec[aria-selected=true]{background:var(--accent);color:#fff}
.sec .n{font-size:.78rem;opacity:.75;margin-left:2px}
.sec-note{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.sec-note[hidden]{display:none}
.secbadge{font-size:.66rem;letter-spacing:.06em;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.secbadge.family{background:var(--accent-soft);color:var(--accent)}
.secbadge.found{background:var(--sage-soft);color:var(--sage)}
.credit strong{color:var(--ink)}
.unsure{font-size:.85em}
.muted{color:var(--muted)}
.adj{border-left:4px solid var(--sage)}
.gaps{border-left:4px solid var(--accent);background:var(--accent-soft)}
.gaps .btn{margin-top:8px}
.tag.gap{background:var(--accent-soft);color:var(--accent)}
.suggest-line{color:var(--muted);font-size:.9rem;margin:18px 4px 0}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:0 0 9px;font-size:.94rem}

/* shopping */
.shop-group{margin-bottom:18px}
.shop-group h3{display:flex;justify-content:space-between;align-items:center;font-family:Fraunces,Georgia,serif;text-transform:none;letter-spacing:0;font-size:1.05rem;color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);font-size:.85rem;padding:0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:24px 0 40px}
.install{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;color:var(--ink);font-size:.92rem}
.install[hidden]{display:none}
@media print{.install{display:none!important}}

@media print{
  header.site,.actions,.back,footer,.hint{display:none!important}
  body{background:#fff;color:#000}
  .panel{border:0;padding:0}
  .r-body{grid-template-columns:1fr 1.5fr;gap:24px}
  ol.steps li{padding:6px 0 6px 36px}
  ol.steps li::before{top:6px;left:0}
  .checklist input{display:none}
}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="#/"><img src="icon-192.png" alt="" width="30" height="30" style="border-radius:50%;object-fit:cover"><span class="brand-name">Family Recipes</span></a>
    <nav class="nav">
    <a class="navbtn share" href="https://tally.so/r/xVrP7o" target="_blank" rel="noopener">+ Share a recipe</a>
    <a class="navbtn" href="#/shopping" id="shopLink">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6 5 3H2"/></svg>
      <span class="shop-label">Shopping list</span> <span class="count" id="shopCount" hidden>0</span>
    </a>
    <a class="navbtn" href="#/favorites" id="favLink" aria-label="Favorites"><span class="fav-heart" aria-hidden="true">♥</span> <span class="shop-label">Favorites</span> <span class="count" id="favCount" hidden>0</span></a>
    </nav>
  </div>
  <nav class="secnav wrap" aria-label="Sections">
    <a href="#/family" data-sec="family"><span class="long">Family </span>Recipe Box</a>
    <a href="#/shelf" data-sec="found"><span class="long">The </span>Cookbook Shelf</a>
    <a href="#/holidays" data-sec="holidays" id="holNav">Holidays</a>
  </nav>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">
  <div class="install" id="installBox">
    <div><strong>📲 Put Family Recipes on your phone</strong><br><span id="installHow">Opens like an app, right from your home screen.</span></div>
    <button class="btn primary" id="installBtn" type="button">Add to home screen</button>
  </div>
  Family Recipes · some our own, others we've found.
</div></footer>

<script src="recipes.js?v=20261111"></script>
<script src="cards.js?v=20261111"></script>
<script>
(function(){
const R = window.RECIPES || [];
const app = document.getElementById('app');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('fr:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('fr:'+k, JSON.stringify(v)); }catch(e){} }
};
let state = { q:'', cat:'All', sec:'all' };

let wakeLock = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
const SUGGEST_URL = 'https://tally.so/r/6DeJLe';
const CAT_ORDER = ['Breakfast','Appetizers','Dinner','Meats & Seafood','Casseroles','Soups','Salads','Breads','Desserts','Beverages','Thanksgiving'];
const suggestLink = r => SUGGEST_URL + '?recipe=' + encodeURIComponent(r.title);
const allText = r => [r.title, r.subtitle, r.summary, r.category, r.credit, ...(r.tags||[]), ...r.ingredients.flatMap(g=>g.items)].join(' ').toLowerCase();

function shopList(){ return store.get('shop', []); }
function favList(){ return store.get('fav', []); }
function isFav(slug){ return favList().includes(slug); }
function updateFavCount(){ const n = favList().filter(s=>R.some(r=>r.slug===s)).length, el = document.getElementById('favCount'); el.hidden = !n; el.textContent = n; }
function favBtn(slug){ const on = isFav(slug); return `<button type="button" class="fav" data-fav="${slug}" aria-pressed="${on}" aria-label="${on?'Remove from favorites':'Add to favorites'}" title="${on?'Remove from favorites':'Favorite this recipe'}">${on?'♥':'♡'}</button>`; }
function toggleFav(slug){ const l = favList(); store.set('fav', l.includes(slug) ? l.filter(s=>s!==slug) : [...l, slug]); updateFavCount(); }
function updateShopCount(){
  const n = shopList().length, el = document.getElementById('shopCount');
  el.hidden = !n; el.textContent = n;
}

const SEC = {
  family: { name:'Family Recipe Box', route:'family', tagline:'Recipes with a family history, tested by generations', blurb:'Recipes from our own kitchens and the cards in the family recipe box, kept just as they were written.' },
  found:  { name:'The Cookbook Shelf', route:'shelf', tagline:'Recipes gathered along the way', blurb:'Recipes from magazines, newspapers, cookbooks and the web that earned a spot on the shelf.' }
};
// Holidays: only "on" ones show on the site. The others are ready to switch on (set on:true).
const ALL_HOLIDAYS = [
  { key:'thanksgiving', on:true,  name:'Thanksgiving', emoji:'🦃', note:'The big table: sides, breads and pies.' },
  { key:'christmas',    on:false, name:'Christmas', emoji:'🎄', note:'Cookies, breakfasts and the holiday dinner.' },
  { key:'new-years',    on:false, name:"New Year's", emoji:'🎆', note:'Appetizers and something warm for the first day of the year.' },
  { key:'easter',       on:false, name:'Easter', emoji:'🐣', note:'Spring dinners, brunch and treats.' },
  { key:'fourth-of-july', on:false, name:'Fourth of July', emoji:'🎇', note:'Cookout sides, salads and summer desserts.' }
];
const HOLIDAYS = ALL_HOLIDAYS.filter(x => x.on);
const HOLIDAY_BY_KEY = Object.fromEntries(HOLIDAYS.map(x=>[x.key,x]));
// Next holiday on the calendar is shown first.
function upcomingHoliday(){
  const m = new Date().getMonth(), d = new Date().getDate();
  const order = [['new-years',0,1],['easter',3,20],['fourth-of-july',6,4],['thanksgiving',10,28],['christmas',11,25]].filter(([k]) => HOLIDAY_BY_KEY[k]);
  for (const [k,mm,dd] of order) if (m < mm || (m === mm && d <= dd)) return k;
  return (order[0] || [HOLIDAYS[0].key])[0];
}
function holNavLabel(){ const n=document.getElementById('holNav'); if(n && HOLIDAYS.length===1) n.textContent = HOLIDAYS[0].name; }
function holidaysPage(key){
  setNav('holidays');
  const hol = HOLIDAY_BY_KEY[key] || HOLIDAY_BY_KEY[upcomingHoliday()];
  document.title = hol.name + ' · Holidays · Family Recipes';
  const inHol = R.filter(r => (r.holidays||[]).includes(hol.key)).sort((a,b)=>a.title.localeCompare(b.title));
  const group = k => { const l = inHol.filter(r=>r.section===k); const s = SEC[k]; return `
    <section class="hol-group ${k}">
      <h2>${s.name} <span class="n">${l.length}</span></h2>
      ${l.length ? `<div class="grid">${l.map(r=>cardHTML(r,false)).join('')}</div>`
        : `<p class="empty-soft">${k==='family' ? `No family ${esc(hol.name)} recipes yet. Is there one we always make?` : `Nothing on the shelf for ${esc(hol.name)} yet.`}</p>`}
    </section>`; };
  const suggest = SUGGEST_URL + '?recipe=' + encodeURIComponent('Holiday: ' + hol.name);
  app.innerHTML = `
    <section class="sec-head holidays">
      <a class="back" href="#/">← Home</a>
      <h1>${HOLIDAYS.length < 2 ? esc(hol.name) : 'Holidays'}</h1>
      <p class="tagline">The dishes that show up every year</p>
    </section>
    <div class="hol-picker" role="tablist" aria-label="Pick a holiday"${HOLIDAYS.length < 2 ? ' hidden' : ''}>
      ${HOLIDAYS.map(x=>{ const n = R.filter(r=>(r.holidays||[]).includes(x.key)).length; return `<a class="hol-chip" role="tab" aria-selected="${x.key===hol.key}" href="#/holidays/${x.key}"><span>${x.emoji}</span> ${esc(x.name)}${n?` <span class="n">${n}</span>`:''}</a>`; }).join('')}
    </div>
    <div class="hol-title">${HOLIDAYS.length < 2 ? '' : `<h2>${hol.emoji} ${esc(hol.name)}</h2>`}<p>${esc(hol.note)}</p></div>
    ${group('family')}
    ${group('found')}
    <div class="share-cta">
      <p><strong>What do you make for ${esc(hol.name)}?</strong> Tell us a recipe from the site that belongs here, or share a new one. Family memories welcome.</p>
      <div class="row-btns">
        <a class="btn primary" href="${suggest}" target="_blank" rel="noopener" style="text-decoration:none">Suggest one for ${esc(hol.name)}</a>
        <a class="btn" href="https://tally.so/r/xVrP7o" target="_blank" rel="noopener" style="text-decoration:none">+ Share a new recipe</a>
      </div>
    </div>`;
  const sel = app.querySelector('.hol-chip[aria-selected=true]'); if (sel) sel.scrollIntoView({block:'nearest', inline:'center'});
  window.scrollTo(0,0);
}

const SPINES = [['#5f7a5a',62,'Soups'],['#b4532a',78,'Breads'],['#2f4858',70,''],['#c9a227',56,'Pies'],['#7a4b3a',84,'Dinners'],['#8fa98a',66,''],['#9c6b30',74,'Sweets'],['#3e5a4a',60,''],['#a8442a',80,'Sides'],['#6b7f99',68,'']].map(([c,hgt,t])=>`<span style="--c:${c};--h:${hgt}%">${t}</span>`).join('');
const secCount = k => R.filter(r=>r.section===k).length;
const catsFor = list => ['All', ...Array.from(new Set(list.map(r=>r.category))).sort((a,b)=>{const i=CAT_ORDER.indexOf(a),j=CAT_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);})];

function setNav(active){
  document.querySelectorAll('.secnav a').forEach(a => a.setAttribute('aria-current', a.dataset.sec === active ? 'page' : 'false'));
}

function home(){
  setNav('');
  const pick = k => { const l = R.filter(r=>r.section===k); return l.length ? l[Math.floor(Math.random()*l.length)] : null; };
  app.innerHTML = `
    <section class="hero">
      <h1>What are we cooking?</h1>
      <p>Two shelves in our kitchen: the cards from the family recipe box, and the recipes we've collected from everywhere else.</p>
    </section>
    <section class="pick" id="pick"><span class="pick-kicker">Today's pick</span><p class="pick-why" id="pickWhy"></p><div id="pickCard"></div><button type="button" class="linkbtn pick-again" id="pickAgain">Show me another idea</button></section>
    <div class="doors">
      ${['family','found'].map(k => { const s = SEC[k], p = pick(k); return `
      <a class="door ${k}" href="#/${s.route}">
        ${k==='family' ? `<span class="door-art box-thumb" aria-hidden="true"><span class="mini-board"><span class="mini-cover"></span></span><span class="mini-post"></span><span class="mini-base"></span></span>` : `<span class="door-art spines" aria-hidden="true">${SPINES}</span>`}
        <span class="door-kicker">${k==='family'?'📇':'📖'} ${secCount(k)} recipes</span>
        <h2>${s.name}</h2>
        <p class="tagline">${s.tagline}</p>
        <p>${s.blurb}</p>
        ${p ? `<span class="door-try">Try: ${esc(p.title)}</span>` : ''}
        <span class="door-go">Open ${s.name} →</span>
      </a>`; }).join('')}
    </div>
    ${(()=>{ const u = HOLIDAY_BY_KEY[upcomingHoliday()]; return `<a class="hol-banner" href="#/holidays/${u.key}"><span class="hol-emoji">${u.emoji}</span><span><strong>${esc(u.name)} is coming up.</strong> See what we make, or tell us yours.</span><span class="door-go">${HOLIDAYS.length < 2 ? esc(u.name) : 'Holidays'} →</span></a>`; })()}
    <a class="pantry-banner" href="#/pantry"><span class="em">🥕</span><span><strong>What's in the fridge?</strong><span class="sub">Tap the ingredients you have and see what you can make.</span></span></a>
    <label class="search" aria-label="Search all recipes" style="display:block;margin:28px 0 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search both: a recipe, an ingredient, or who it's from…" value="${esc(state.q)}">
    </label>
    <div class="grid" id="grid" style="margin-top:18px"></div>
    <div class="share-cta">
      <p><strong>Have a family favorite?</strong> Type it in or just snap a photo of the recipe card. No account needed.</p>
      <a class="btn primary" href="https://tally.so/r/xVrP7o" target="_blank" rel="noopener" style="text-decoration:none">+ Share a recipe</a>
    </div>`;
  state.sec = 'all'; state.cat = 'All';
  const q = document.getElementById('q');
  q.addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
  renderGrid(); startPick();
}

function sectionPage(k){
  const s = SEC[k]; setNav(k);
  document.title = s.name + ' · Family Recipes';
  if (state.sec !== k) { state.sec = k; state.cat = 'All'; }
  const cats = catsFor(R.filter(r=>r.section===k));
  if (!cats.includes(state.cat)) state.cat = 'All';
  app.innerHTML = `
    <section class="sec-head ${k}">
      <a class="back" href="#/">← Home</a>
      ${k==='family' ? `
      <div class="stand">
        <div class="stand-obj" aria-hidden="true">

function renderGrid(){
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const onHome = state.sec === 'all';
  if (onHome && !terms.length) { document.getElementById('grid').innerHTML = ''; return; }
  const list = R.slice().sort((a,b)=>a.title.localeCompare(b.title)).filter(r => (onHome || r.section===state.sec) && (state.cat==='All' || r.category===state.cat) && terms.every(t => allText(r).includes(t)));
  const g = document.getElementById('grid');
  g.innerHTML = list.length ? list.map(r => cardHTML(r, onHome)).join('') : `<p class="empty">No recipes match that search.</p>`;
}

// ---- Scaling ingredient amounts ----
const UF = {'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875,'⅕':.2};
function takeQty(s){
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)/))) return { v: +m[1] + m[2]/m[3], len: m[0].length };
  if ((m = s.match(/^(\d+)\/(\d+)/))) return { v: m[1]/m[2], len: m[0].length };
  if ((m = s.match(/^(\d+)?\s?([¼½¾⅓⅔⅛⅜⅝⅞⅕])/))) return { v: (+m[1]||0) + UF[m[2]], len: m[0].length };
  if ((m = s.match(/^\d+(?:\.\d+)?/))) return { v: +m[0], len: m[0].length };
  return null;
}
function fmtQty(v){
  if (v >= 10) { const h = Math.round(v*2)/2; return Number.isInteger(h) ? String(h) : Math.floor(h)+'½'; }
  const opts = [[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.875,'⅞'],[1,'']];
  let whole = Math.floor(v + 1e-9), f = v - whole, best = opts[0], bd = 9;
  opts.forEach(o => { const d = Math.abs(f - o[0]); if (d < bd) { bd = d; best = o; } });
  if (best[0] === 1) { whole += 1; best = opts[0]; }
  if (!whole && !best[1]) return '⅛';
  return (whole || '') + best[1];
}
function scaleItem(it, k){
  if (k === 1) return it;
  const a = takeQty(it); if (!a) return it;
  let rest = it.slice(a.len), out = fmtQty(a.v * k);
  const r = rest.match(/^(\s*(?:–|-|to)\s*)(?=[\d¼½¾⅓⅔⅛⅜⅝⅞⅕])/);
  if (r) { const b = takeQty(rest.slice(r[0].length)); if (b) { out += r[1] + fmtQty(b.v * k); rest = rest.slice(r[0].length + b.len); } }
  rest = rest.replace(/^(\s+)(cups?|c\.?)(?=[\s,.)]|$)/i, (m0, sp, u) => /^c/i.test(u) && !/^cup/i.test(u) ? m0 : sp + (a.v * k > 1 ? 'cups' : 'cup'));
  if (!r && /^\s+cups?\b/i.test(rest) && a.v * k < .25 && a.v * k > 0) { return fmtQty(a.v * k * 16) + rest.replace(/^(\s+)cups?/i, '$1tbsp'); }
  if (!r && /^\s+(?:tbsp|T)\b/.test(rest) && a.v * k < 1 && a.v * k > 0) { return fmtQty(a.v * k * 3) + rest.replace(/^(\s+)(?:tbsp|T)\.?/, '$1tsp'); }
  return out + rest;
}
function baseServes(r){
  const s = String(r.serves || '');
  if (!/^\d+/.test(s) || /loaf|loaves|doz|crust|qt|calor/i.test(s)) return 0;
  return parseInt(s, 10) || 0;
}
function ingListHtml(r, checks, k){
  let n = 0;
  return r.ingredients.map(g => `
    ${g.name ? `<h3>${esc(g.name)}</h3>` : ''}
    <ul class="checklist">${g.items.map(it => { const id = 'i'+(n++); return `<li><label><input type="checkbox" data-k="${id}" ${checks[id]?'checked':''}><span>${esc(scaleItem(it, k))}</span></label></li>`; }).join('')}</ul>`).join('');
}
function scaleBarHtml(r){
  const base = baseServes(r);
  return `<div class="scale" id="scale"><span class="scale-label">Scale</span>
    <div class="seg" role="group" aria-label="Recipe size">${[['½×',.5],['1×',1],['2×',2],['3×',3]].map(([l,k])=>`<button type="button" data-k="${k}" aria-pressed="${k===1}">${l}</button>`).join('')}</div>
    ${base ? `<span class="serv">Serves <button type="button" id="servDn" aria-label="Fewer servings">−</button><b id="servN">${base}</b><button type="button" id="servUp" aria-label="More servings">+</button></span>` : ''}
    <p class="scale-note" id="scaleNote" hidden>Amounts are adjusted automatically. Baking times, pan sizes and seasoning may need a little judgment.</p></div>`;
}
function bindScale(r, checks, bindChecks){
  const base = baseServes(r); let k = 1;
  const box = document.getElementById('ingList'); if (!box) return;
  const apply = () => {
    box.innerHTML = ingListHtml(r, checks, k); bindChecks();
    document.querySelectorAll('#scale .seg button').forEach(b => b.setAttribute('aria-pressed', Math.abs(+b.dataset.k - k) < 1e-6));
    const sn = document.getElementById('servN'); if (sn) sn.textContent = fmtQty(base * k);
    document.getElementById('scaleNote').hidden = k === 1;
  };
  document.querySelectorAll('#scale .seg button').forEach(b => b.onclick = () => { k = +b.dataset.k; apply(); });
  const dn = document.getElementById('servDn'), up = document.getElementById('servUp');
  if (dn) dn.onclick = () => { const n = Math.round(base * k * 2) / 2 - 1; if (n >= 1) { k = n / base; apply(); } };
  if (up) up.onclick = () => { k = (Math.round(base * k * 2) / 2 + 1) / base; apply(); };
}

document.addEventListener('click', e => {
  const z = e.target.closest && e.target.closest('[data-zoom]');
  if (z) {
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label','Photo');

    const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); };

    lb.onclick = close; document.addEventListener('keydown', onKey); document.body.appendChild(lb);
    return;
  }
});

  ['Cranberries','cranberr'],['Pumpkin','pumpkin'],['Lemon & orange','lemon|orange'],['Berries','strawberr|blueberr|raspberr'],['Chocolate','chocolate|cocoa|carob'],['Nuts','walnut|pecan|almond|\\bnuts?\\b'],['Oats','\\boats?\\b|oatmeal'],
  ['Bread & stuffing','bread crumb|breadcrumb|stuffing|\\bbread\\b'],['Molasses & maple','molasses|maple'],['Peanut butter','peanut butter'],['Pineapple','pineapple'],['Cinnamon & spice','cinnamon|nutmeg|ginger|allspice']
].map(([label, re]) => ({ label, re: new RegExp(re, 'i') }));
let pantrySel = [];
const ingText = r => r.ingredients.flatMap(g => g.items).join(' | ');
function pantryPage(){
  setNav(''); document.title = "What's in the fridge? · Family Recipes";
  const texts = new Map(R.map(r => [r.slug, ingText(r)]));
  const avail = PANTRY.filter(p => R.some(r => p.re.test(texts.get(r.slug))));
  app.innerHTML = `<a class="back" href="#/">← Home</a>
    <div class="r-head"><h1>🥕 What's in the fridge?</h1><p class="summary">Tap what you have on hand. We'll show the recipes that use it, best matches first.</p></div>
    <div class="pantry-grid" id="pgrid">${avail.map(p => `<button type="button" class="chip" data-p="${esc(p.label)}" aria-pressed="${pantrySel.includes(p.label)}">${esc(p.label)}</button>`).join('')}</div>
    <p><button class="linkbtn" id="pclear" ${pantrySel.length?'':'hidden'}>Clear all</button></p>
    <div id="pres"></div>`;
  const show = () => {
    const sel = avail.filter(p => pantrySel.includes(p.label));
    const out = document.getElementById('pres');
    document.getElementById('pclear').hidden = !sel.length;
    if (!sel.length) { out.innerHTML = `<p class="empty">Pick one or more ingredients above to see recipes.</p>`; return; }
    const rows = R.map(r => { const hit = sel.filter(p => p.re.test(texts.get(r.slug))); return { r, hit, miss: sel.filter(p => !hit.includes(p)) }; })
      .filter(x => x.hit.length).sort((a,b) => b.hit.length - a.hit.length || a.r.title.localeCompare(b.r.title));
    if (!rows.length) { out.innerHTML = `<p class="empty">Nothing in the box uses that combination yet.</p>`; return; }
    const all = rows.filter(x => !x.miss.length);
    out.innerHTML = `<p class="fav-note">${all.length ? `${all.length} recipe${all.length>1?'s use':' uses'} everything you picked.` : `No recipe uses everything, so here are the closest matches.`}</p>
      <div class="grid">${rows.map(x => `<div class="pantry-hit"><p class="why ${x.miss.length?'':'all'}">${x.miss.length ? `Uses ${x.hit.length} of ${sel.length} · not in it: ${x.miss.map(m=>esc(m.label.toLowerCase())).join(', ')}` : '✓ Uses everything you picked'}</p>${cardHTML(x.r, true)}</div>`).join('')}</div>`;
  };
  document.getElementById('pgrid').onclick = e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const l = b.dataset.p; pantrySel = pantrySel.includes(l) ? pantrySel.filter(x => x !== l) : [...pantrySel, l];
    b.setAttribute('aria-pressed', pantrySel.includes(l)); show();
  };
  document.getElementById('pclear').onclick = () => { pantrySel = []; pantryPage(); };
  show();
}

// ---- Today's pick: time of day, weather, season, holidays ----
const WX = c => c==null ? '' : c>=95 ? 'stormy' : (c>=71&&c<=77)||c===85||c===86 ? 'snowy' : (c>=51&&c<=67)||(c>=80&&c<=82) ? 'rainy' : c===45||c===48 ? 'foggy' : c<=1 ? 'clear' : 'cloudy';
async function getWeather(){
  try {
    const c = JSON.parse(sessionStorage.getItem('fr:wx') || 'null');
    if (c && Date.now() - c.at < 30*60*1000) return c.w;
  } catch(e) {}
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 4500);
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=42.857&longitude=-70.93&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FNew_York', { signal: ctl.signal });
    clearTimeout(to); const j = await r.json();
    const w = { t: Math.round(j.current.temperature_2m), wx: WX(j.current.weather_code) };
    try { sessionStorage.setItem('fr:wx', JSON.stringify({ at: Date.now(), w })); } catch(e) {}
    return w;
  } catch(e) { return null; }
}
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; };
function pickList(w){
  const now = new Date(), m = now.getMonth(), hr = now.getHours() + now.getMinutes()/60, dow = now.getDay(), wkend = dow === 0 || dow === 6;
  const period = hr < 10.5 ? 'morning' : hr < 15 ? 'midday' : 'evening';
  const dateKey = now.toISOString().slice(0,10) + period;
  const hk = upcomingHoliday(), hol = HOLIDAY_BY_KEY[hk];
  const favs = favList();
  const cold = w && w.t <= 42, cool = w && w.t > 42 && w.t <= 60, hot = w && w.t >= 78;
  const wet = w && ['rainy','snowy','stormy'].includes(w.wx);
  const season = m>=8&&m<=10 ? 'fall' : (m===11||m<=1) ? 'winter' : m<=4 ? 'spring' : 'summer';
  const SEASON_RE = { fall:/pumpkin|apple|cranberr|squash|maple|cinnamon|molasses|nutmeg/i, winter:/chocolate|cranberr|ginger|molasses|nut|cinnamon|maple/i, spring:/lemon|asparagus|rhubarb|strawberr|egg|spinach/i, summer:/corn|tomato|berr|peach|lemon|zucchini|cucumber|cabbage/i };
  const scored = R.map(r => {
    let s = 0; const why = [];
    const add = (n, text) => { s += n; if (n > 0 && text) why.push([n, text]); };
    const cat = r.category, txt = ingText(r) + ' ' + r.title;
    if (period === 'morning') { if (cat === 'Breakfast') add(wkend ? 5 : 4, wkend ? 'a weekend morning, perfect for breakfast' : 'a good morning for breakfast'); else if (cat === 'Beverages') add(1); }
    else { if (cat === 'Breakfast') s -= 3; }
    if (period === 'midday') { if (['Soups','Salads','Breads','Appetizers','Dinner'].includes(cat)) add(1.5, 'a good lunchtime pick'); }
    if (period === 'evening') { if (['Dinner','Meats & Seafood','Casseroles','Soups'].includes(cat)) add(2, 'what\'s for dinner tonight'); if (cat === 'Desserts') add(.8, 'something sweet after dinner'); }
    if (period !== 'evening' && cat === 'Desserts') s -= .5;
    if (w) {
      const where = `${w.t}°F${w.wx && w.wx!=='clear' && w.wx!=='cloudy' ? ' and '+w.wx : ''} in Amesbury`;
      if (cold) { if (cat === 'Soups') add(3.5, `${where}, soup weather`); if (cat === 'Casseroles') add(2.5, `${where}, comfort-food weather`); if (cat === 'Breads') add(1.2, `${where}, a good day to bake`); if (cat === 'Salads') s -= 2; if (cat === 'Beverages') add(1, `${where}, something warm`); }
      else if (cool) { if (cat === 'Soups' || cat === 'Casseroles') add(1.2, `a cool ${w.t}°F day`); }
      if (hot) { if (cat === 'Salads') add(3.5, `${where}, keep it light`); if (cat === 'Beverages') add(3, `${where}, time for something cold`); if (cat === 'Soups') s -= 2.5; if (cat === 'Casseroles') s -= 2; if (cat === 'Meats & Seafood') add(1, `${where}, good grilling weather`); }
      if (wet) { if (cat === 'Soups' || cat === 'Casseroles') add(1.5, `${w.wx} out, stay in and cook`); if (cat === 'Breads' || cat === 'Desserts') add(1, `${w.wx} out, a good day to bake`); }
    }
    if (SEASON_RE[season].test(txt)) add(2, { fall:'fall flavors are in season', winter:'a winter-kitchen favorite', spring:'a fresh spring flavor', summer:'a taste of summer' }[season]);
    if (hol && (r.holidays||[]).includes(hk)) add(5, `${hol.name} is coming up`);
    if (wkend && (cat === 'Breads' || cat === 'Desserts' || cat === 'Casseroles')) add(.8, 'a weekend for slow cooking');
    if (favs.includes(r.slug)) add(1, 'one of your favorites');
    s += (hash(r.slug + dateKey) % 100) / 100 * 1.6;
    return { r, s, why: why.sort((a,b) => b[0]-a[0]).map(x => x[1]) };
  }).sort((a,b) => b.s - a.s);
  return scored;
}
function pickHtml(item){
  const w0 = item.why[0]; const line = w0 ? w0.charAt(0).toUpperCase() + w0.slice(1) + '.' : 'A family favorite worth a try.';
  return { why: line, card: cardHTML(item.r, true) };
}
function startPick(){
  const box = document.getElementById('pick'); if (!box) return;
  let w = null, off = 0;
  const draw = () => {
    const list = pickList(w).slice(0, 6); const it = list[off % list.length], h = pickHtml(it);
    document.getElementById('pickWhy').textContent = h.why; document.getElementById('pickCard').innerHTML = h.card;
  };
  draw();
  document.getElementById('pickAgain').onclick = () => { off++; draw(); };
  getWeather().then(x => { if (x && document.getElementById('pick') === box) { w = x; draw(); } });
}

function favoritesPage(){
  setNav(''); document.title = 'Favorites · Family Recipes';
  const list = favList().map(s => R.find(r=>r.slug===s)).filter(Boolean).sort((a,b)=>a.title.localeCompare(b.title));
  app.innerHTML = `<a class="back" href="#/">← Home</a>
    <div class="r-head"><h1>♥ Favorites</h1><p class="summary">${list.length ? 'Your favorite recipes, all in one place.' : 'Tap the heart on any recipe to save it here.'}</p></div>
    ${list.length ? `<p class="fav-note">Saved on this phone or computer only.</p><div class="grid">${list.map(r=>cardHTML(r,true)).join('')}</div>` : `<p class="empty">No favorites yet. Look for the ♡ on any recipe.</p>`}`;
}

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  document.title = 'Family Recipes';
  if(h.startsWith('recipe/')) recipe(h.slice(7));
  else if(h === 'shopping') { setNav(''); shopping(); }
  else if(h === 'favorites') favoritesPage();
  else if(h === 'pantry') pantryPage();
  else if(h === 'family') sectionPage('family');
  else if(h === 'shelf') sectionPage('found');
  else if(h === 'holidays' || h.startsWith('holidays/')) holidaysPage(h.split('/')[1]);
  else home();
  updateShopCount(); updateFavCount();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-fav]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const slug = b.dataset.fav; toggleFav(slug);
  if (location.hash.replace(/^#\/?/, '') === 'favorites') { favoritesPage(); return; }
  const on = isFav(slug);
  document.querySelectorAll('[data-fav="'+slug+'"]').forEach(x => { x.setAttribute('aria-pressed', on); x.textContent = on ? '♥' : '♡'; x.setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites'); });
}, true);
holNavLabel();

// ---- Install as an app (anyone, no login) ----
(function(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function(){});
  var box = document.getElementById('installBox'), btn = document.getElementById('installBtn'), how = document.getElementById('installHow');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) { box.hidden = true; return; }
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var samsung = /SamsungBrowser/.test(navigator.userAgent);
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function(){ box.hidden = true; });
  btn.onclick = function(){
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function(){ deferred = null; }); return; }
    how.textContent = ios
      ? 'In Safari, tap the Share icon in the toolbar, then “Add to Home Screen.”'
      : samsung
        ? 'Tap ☰ at the bottom right, then “Add page to” → “Home screen.”'
        : 'Open your browser menu (⋮) and choose “Install app” or “Add to Home screen.”';
  };
})();
route();
})();
</script>
